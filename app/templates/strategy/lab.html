<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategy Lab</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    body { background:#0b1220; color:#e2e8f0; font-family: Inter, system-ui; margin:0; color-scheme: dark; }
    .container { max-width: 1400px; margin: 20px auto; padding: 20px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; }
    .nav { display:flex; gap:8px; }
    .nav a { text-decoration:none; color:#e2e8f0; background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:8px 12px; border-radius:6px; }
    .nav a.active { background: rgba(34,197,94,0.2); border-color:#22c55e; }
    .card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:16px; margin-bottom:16px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
    .col { display:flex; flex-direction:column; }
    label { font-size: 12px; color:#cbd5e1; }
  input, select { padding:6px 8px; font-size:14px; background:#0f172a; border:1px solid rgba(255,255,255,0.1); color:#e2e8f0; border-radius:6px; }
  select option { background:#0b1220; color:#e2e8f0; }
    button { padding:8px 12px; font-size:14px; cursor:pointer; }
    #chart { width:100%; height:520px; }
    #metrics { margin-top:10px; font-size:14px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); margin-right:6px; }
    .trade-list { max-height: 200px; overflow:auto; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:6px; border-radius:6px; }
    .trade-buy { color:#10b981; }
    .trade-sell { color:#ef4444; }
    /* Compact numeric inputs for MACD/ADV/Slippage/etc */
    .compact { width: 90px; }
    /* Short text/selects (symbol/strategy) */
    .short { width: 120px; }
    .short-sel { width: 170px; }
    .playback-panel { display:none; margin-top:12px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(15,23,42,0.55); box-shadow:0 6px 14px rgba(15,23,42,0.35); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .playback-panel button { background:rgba(34,197,94,0.18); border:1px solid rgba(34,197,94,0.45); color:#22c55e; border-radius:6px; padding:6px 10px; min-width:56px; font-size:13px; }
    .playback-panel button.secondary { background:rgba(148,163,184,0.14); border-color:rgba(148,163,184,0.35); color:#cbd5f5; }
    .playback-panel button:disabled { opacity:0.45; cursor:not-allowed; }
    .playback-speed { width:auto; padding:6px 8px; font-size:13px; background:#0f172a; border:1px solid rgba(255,255,255,0.12); color:#e2e8f0; border-radius:6px; }
    .playback-date { font-size:12px; color:#cbd5e1; margin-left:4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 style="margin:0;">Strategy Lab</h2>
      <div class="nav">
    <a href="/rl">RL</a>
    <a href="/ml" class="">ML</a>
        <a href="/scanner">Scanner</a>
        <a href="/strategy" class="active">Strategy</a>
      </div>
    </div>

    <div class="card">
  <div class="row">
    <div class="col">
  <label for="symbol">Symbol</label>
  <input id="symbol" placeholder="AAPL" value="AAPL" class="short" title="סימבול מניה/ETF לדוגמה: AAPL, NVDA, QQQ" />
    </div>

  <label for="start">Start date</label>
  <input id="start" type="date" value="2025-01-01" title="תאריך התחלה. אם נשאר ריק, משתמשים בשדה Days כדי לקבוע טווח" />
    </div>
    <div class="col">
  <label for="end">End date</label>
  <input id="end" type="date" title="תאריך סיום. אם נשאר ריק, נשתמש ביום המסחר האחרון" />

        <option value="macd_cross" selected>MACD Cross</option>
        <option value="macd_pre_cross_below_zero">MACD Pre-cross ETF (5-35-5)</option>

    </div>
    <div class="col">
  <label for="macd_fast">MACD fast</label>
  <input id="macd_fast" type="number" value="12" min="2" class="compact" title="EMA מהיר ל‑MACD (ברירת מחדל 12)" />

    <div class="col">
  <label for="macd_slow">MACD slow</label>
  <input id="macd_slow" type="number" value="26" min="3" class="compact" title="EMA איטי ל‑MACD (ברירת מחדל 26)" />
    </div>
    <div class="col">
  <label for="macd_signal">MACD signal</label>
  <input id="macd_signal" type="number" value="9" min="2" class="compact" title="חלון סיגנל ל‑MACD (ברירת מחדל 9)" />

    <div class="col">

    </div>
    <div class="col">
      <label for="conv_win">Conv W</label>
      <input id="conv_win" type="number" value="60" min="10" max="252" class="compact" title="חלון לרולינג מקסימום של מרחק MACD‑Signal לצורך יחס התכנסות (ברירת מחדל 60)" />
    </div>
    <div class="col">
      <label for="p_buy">P_buy %</label>
      <input id="p_buy" type="number" value="35" min="1" max="100" step="1" class="compact" title="סף התכווצות לסט־אפ קנייה: conv_ratio ≤ P_buy% (ברירת מחדל 35%)" />

    <div class="col">

    <div class="col">

    </div>
    <!-- Price-following overlays controls -->
    <div class="col">
      <label for="show_ma">Show EMA 20/50</label>
      <input id="show_ma" type="checkbox" checked title="הצג ממוצעים נעים EMA(20/50) על המחיר" />
    </div>
    <div class="col">
      <label for="ema_fast">EMA fast</label>

    </div>
    <!-- Visualization-only indicators -->
    <div class="col">
      <label for="show_rsi">Show RSI</label>

    </div>
    <div class="col">
      <label for="stoch_d">Stoch D</label>
      <input id="stoch_d" type="number" value="3" min="2" class="compact" title="חלון ממוצע %D (ברירת מחדל 3)" />
    </div>
    <div class="col">
      <label for="adx_min">ADX min</label>
      <input id="adx_min" type="number" value="25" min="0" class="compact" title="סף מגמתיות לכניסה (ברירת מחדל 25; אפשר 20 ללברג׳ד כמו TNA)" />

    <div class="col">
  <label for="cash">Initial cash</label>
  <input id="cash" type="number" value="10000" step="100" class="compact" title="הון התחלתי לסימולציה ($)" />

  <label for="tcost">Tx cost (bps)</label>
  <input id="tcost" type="number" value="5" min="0" class="compact" title="עלות עסקה בבסיס נקודות (bps = 0.01%). לדוגמה 5 = 0.05%" />

  <input id="slip" type="number" value="5" min="0" class="compact" title="סליפג׳ מוערך בבסיס נקודות (bps). לדוגמה 5 = 0.05%" />

  <label for="days">Last days</label>
  <input id="days" type="number" value="250" min="30" class="compact" title="כששדות התאריך ריקים — משך החלון לאחור (ימים)" />
    </div>
    <div class="col">
  <label for="advp">ADV period</label>
  <input id="advp" type="number" value="20" min="2" class="compact" title="חלון חישוב ממוצע מחזור (Average Daily Volume) בימים" />
    </div>
    <div class="col">
  <label for="cwidth">Candle line width</label>
  <input id="cwidth" type="number" value="1.8" step="0.2" min="0.6" class="compact" title="עובי קווי הנרות (כדי לשפר קריאות בצפיפות)" />

    <div class="col">
  <label for="show_eq">Equity</label>
  <input id="show_eq" type="checkbox" checked title="הצג/הסתר קו הון מצטבר של האסטרטגיה (Equity) על פנל המחיר" />

  <button id="run" style="background:#22c55e; border:none; color:white; border-radius:6px;" title="הרצה עם הפרמטרים הנוכחיים">Run ></button>

    <select id="pb-speed" class="playback-speed" title="מספר ימים בכל צעד בזמן Play">
  <option value="1">x1</option>
  <option value="2">x2</option>
  <option value="5">x5</option>

    <span id="pb-date" class="playback-date">—</span>
  </div>

    <div class="card">
      <div id="status" style="font-family: ui-monospace, Consolas, monospace; font-size: 12px; opacity:0.85; margin-bottom:6px;"></div>
      <div id="quick" style="margin-bottom:8px;"></div>
      <div id="chart"></div>

  <script>
    function formatPct(x) { return (x ?? 0).toFixed(2) + '%'; }
    function fmtMoney(x) { return (x).toLocaleString(undefined, {maximumFractionDigits:2}); }
    function lastBusinessDateISO() {
      const d = new Date();
      const day = d.getDay();
      if (day === 0) d.setDate(d.getDate() - 2); // Sunday -> Friday
      else if (day === 6) d.setDate(d.getDate() - 1); // Saturday -> Friday
      return d.toISOString().slice(0,10);
    }
    function initDefaultDates() {
      const s = document.getElementById('start');
      const e = document.getElementById('end');
      if (!s.value) s.value = '2025-01-01';
      if (!e.value) e.value = lastBusinessDateISO();
    }
    function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); }; }

    const playbackState = {
      latestResult: null,
      requestBody: null,
      pointer: null,
      maxIndex: -1,
      playing: false,
      timer: null,
      speed: 1,
      pending: false,
      timeline: [],
      timelineTimes: [],
      canExtend: false,
      minIndex: 0,
      rangeStartIdx: 0,
      rangeStartISO: null,
      actualStartISO: null,
    };

    const playbackControls = {
      container: null,
      playBtn: null,
      stepForwardBtn: null,
      stepBackBtn: null,
      speedSelect: null,
      dateLabel: null,
    };

    function cloneBody(body) {
      return JSON.parse(JSON.stringify(body || {}));
    }

    function toTimestamp(value) {
      if (value == null) return NaN;
      if (typeof value === 'number') return Number.isFinite(value) ? value : NaN;
      if (value instanceof Date) return value.getTime();
      let str = String(value).trim();
      if (!str) return NaN;
      if (str.length <= 10 && !str.includes('T')) {
        str = `${str}T00:00:00Z`;
      } else if (str.includes(' ')) {
        str = str.replace(' ', 'T');
      }
      const ts = Date.parse(str);
      if (!Number.isNaN(ts)) return ts;
      return Date.parse(String(value));
    }

    function findTimelineIndex(timeline, targetISO, prefer = 'forward') {
      if (!Array.isArray(timeline) || !timeline.length || !targetISO) return -1;
      const times = playbackState.timelineTimes && playbackState.timelineTimes.length === timeline.length
        ? playbackState.timelineTimes
        : timeline.map(toTimestamp);
      const targetTs = toTimestamp(targetISO);
      if (!Number.isFinite(targetTs)) return -1;
      if (prefer === 'forward') {
        for (let i = 0; i < times.length; i++) {
          if (times[i] >= targetTs) return i;
        }
        return times.length - 1;
      }
      if (prefer === 'backward') {
        for (let i = times.length - 1; i >= 0; i--) {
          if (times[i] <= targetTs) return i;
        }
        return 0;
      }
      return -1;
    }

    function trimBacktestResult(data, fromIdx) {
      if (!data || !Array.isArray(data.dates) || fromIdx <= 0) return data;
      const originalDates = data.dates;
      const trimmed = {...data};
      const keys = Object.keys(trimmed);
      for (const key of keys) {
        const value = trimmed[key];
        if (Array.isArray(value) && value.length === originalDates.length) {
          trimmed[key] = value.slice(fromIdx);
        }
      }
      if (Array.isArray(trimmed.trades)) {
        const startTs = toTimestamp(trimmed.dates?.[0]);
        trimmed.trades = trimmed.trades.filter(tr => toTimestamp(tr.date) >= startTs);
      }
      return trimmed;
    }

    function deriveMinPlayableIndex(js) {
      const timelineLen = Array.isArray(js.dates) ? js.dates.length : 0;
      if (!timelineLen) return 0;
      let minIdx = 0;
      const indicators = [js.macd, js.macd_signal, js.equity, js.rsi, js.stoch_k, js.stoch_d];
      for (const arr of indicators) {
        if (!Array.isArray(arr)) continue;
        const idx = arr.findIndex((v) => v != null && !Number.isNaN(v));
        if (idx > minIdx) minIdx = idx;
      }
      if (minIdx >= timelineLen) {
        minIdx = timelineLen - 1;
      }
      return Math.max(0, minIdx);
    }

    async function fetchBacktest(body) {
      const res = await fetch('/api/strategy/backtest', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      let js;
      try {
        js = await res.json();
      } catch (e) {
        const text = await res.text().catch(() => '');
        throw new Error('Invalid JSON from server: ' + (text ? text.slice(0, 200) : String(e)));
      }
      if (!res.ok || js.status !== 'ok') {
        throw new Error(js.detail || `HTTP ${res.status}`);
      }
      return js;
    }

    function handleBacktestSuccess(js, requestBody, opts = {}) {
      const status = document.getElementById('status');
      const quick = document.getElementById('quick');
      const dates = js.dates || [];
      const metrics = js.metrics || {};
      const symbol = requestBody.symbol || playbackState.requestBody?.symbol || '';
      const firstDate = requestBody.start_date || dates[0] || '';
      const lastDate = requestBody.end_date || dates[dates.length - 1] || '';
      const totalReturn = typeof metrics.total_return_pct === 'number' ? `${metrics.total_return_pct.toFixed(2)}%` : 'n/a';
      const numTrades = typeof metrics.num_trades === 'number' ? metrics.num_trades : '0';
      if (status) {
        status.textContent = `OK — ${symbol} ${firstDate} → ${lastDate} | Trades ${numTrades} | Return ${totalReturn}`;
      }
      if (quick) {
        const winRate = metrics.win_rate != null ? `${(metrics.win_rate * 100).toFixed(1)}%` : 'n/a';
        const maxDD = typeof metrics.max_drawdown_pct === 'number' ? `${metrics.max_drawdown_pct.toFixed(2)}%` : 'n/a';
        quick.innerHTML = `<span class="pill">Ret ${totalReturn}</span><span class="pill">Win ${winRate}</span><span class="pill">DD ${maxDD}</span>`;
      }

      let result = js || {};
      const rawTimeline = Array.isArray(result.dates) ? result.dates.slice() : [];
      const shouldRebaseline = opts.resetTimeline || !playbackState.timeline || (rawTimeline.length > (playbackState.timeline?.length || 0));

      const requestedStartISO = requestBody.start_date || playbackState.rangeStartISO || null;
      const desiredStartISO = requestedStartISO || playbackState.actualStartISO || rawTimeline[0] || null;
      let trimIdxRaw = -1;
      if (desiredStartISO) {
        trimIdxRaw = findTimelineIndex(rawTimeline, desiredStartISO, 'forward');
      }
      if (trimIdxRaw > 0) {
        result = trimBacktestResult(result, trimIdxRaw);
      }

      if (shouldRebaseline) {
        const baselineIdx = trimIdxRaw > 0 ? trimIdxRaw : 0;
        playbackState.timeline = rawTimeline.slice(baselineIdx);
        playbackState.timelineTimes = playbackState.timeline.map(toTimestamp);
      }

      const timeline = playbackState.timeline || [];
      playbackState.latestResult = result;
      playbackState.maxIndex = timeline.length - 1;

  playbackState.minIndex = deriveMinPlayableIndex(result);
      if (playbackState.minIndex > playbackState.maxIndex) {
        playbackState.minIndex = playbackState.maxIndex;
      }

      if (opts.resetTimeline) {
        if (requestedStartISO) {
          const idx = findTimelineIndex(timeline, requestedStartISO, 'forward');
          playbackState.rangeStartIdx = idx >= 0 ? idx : playbackState.minIndex ?? 0;
        } else {
          playbackState.rangeStartIdx = playbackState.minIndex ?? 0;
        }
      }

      const startBound = Math.max(playbackState.minIndex ?? 0, playbackState.rangeStartIdx ?? 0);
      playbackState.actualStartISO = timeline[startBound] || timeline[0] || null;

      const pointerFallback = opts.pointerFallback || 'end';
      const defaultPointerISO = pointerFallback === 'start'
        ? (requestedStartISO || playbackState.actualStartISO || timeline[0] || null)
        : (timeline[timeline.length - 1] || null);
      const pointerDate = opts.pointerDate ?? defaultPointerISO;
      const preferMode = pointerFallback === 'start' ? 'forward' : 'backward';
      let pointerIdx = pointerDate ? findTimelineIndex(timeline, pointerDate, preferMode) : -1;
      if (pointerIdx < startBound) pointerIdx = startBound;
      if (pointerIdx > playbackState.maxIndex) pointerIdx = playbackState.maxIndex;
      playbackState.pointer = Number.isFinite(pointerIdx) && pointerIdx >= 0 ? pointerIdx : null;

      if (opts.resetTimeline && status && playbackState.actualStartISO) {
        status.textContent += ` | Playback start ${playbackState.actualStartISO}`;
      }

      if (!opts.preserveRequest) {
        playbackState.requestBody = cloneBody(requestBody);
      }

      render(result);
    }

    function setupPlaybackControls() {
      playbackControls.container = document.getElementById('playback-panel');
      if (!playbackControls.container) return;
      playbackControls.playBtn = document.getElementById('pb-toggle');
      playbackControls.stepForwardBtn = document.getElementById('pb-step-forward');
      playbackControls.stepBackBtn = document.getElementById('pb-step-back');
      playbackControls.speedSelect = document.getElementById('pb-speed');
      playbackControls.dateLabel = document.getElementById('pb-date');

      playbackState.speed = Number(playbackControls.speedSelect?.value) || 1;

      playbackControls.playBtn?.addEventListener('click', togglePlayback);
      playbackControls.stepForwardBtn?.addEventListener('click', () => stepPlayback(1));
      playbackControls.stepBackBtn?.addEventListener('click', () => stepPlayback(-1));
      playbackControls.speedSelect?.addEventListener('change', handlePlaybackSpeedChange);

      updatePlaybackUI();
    }

    function updatePlaybackUI() {
      const panel = playbackControls.container;
      if (!panel) return;
      const timeline = playbackState.timeline || [];
      if (!timeline.length || timeline.length < 2) {
        panel.style.display = 'none';
        if (playbackControls.dateLabel) {
          playbackControls.dateLabel.textContent = timeline.length ? timeline[timeline.length - 1] : '—';
        }
        return;
      }

      panel.style.display = 'flex';
      const pointer = playbackState.pointer;
  const minIdx = Math.max(playbackState.minIndex ?? 0, playbackState.rangeStartIdx ?? 0);
  const atStart = pointer == null || pointer <= minIdx;
      const atEnd = pointer == null || pointer >= playbackState.maxIndex;

      if (playbackControls.dateLabel) {
        playbackControls.dateLabel.textContent = pointer != null && pointer >= 0 ? timeline[pointer] : '—';
      }
      if (playbackControls.stepBackBtn) {
        playbackControls.stepBackBtn.disabled = playbackState.pending || playbackState.playing || atStart;
      }
      if (playbackControls.stepForwardBtn) {
        playbackControls.stepForwardBtn.disabled = playbackState.pending || playbackState.playing || atEnd;
      }
      if (playbackControls.playBtn) {
        const span = playbackState.maxIndex - minIdx;
        playbackControls.playBtn.disabled = playbackState.pending || span <= 0;
        playbackControls.playBtn.textContent = playbackState.playing ? 'Pause ||' : 'Play >';
      }
      if (playbackControls.speedSelect) {
        const val = playbackControls.speedSelect.value || '1';
        playbackState.speed = Number(val) || 1;
      }
    }

    function handlePlaybackSpeedChange() {
      playbackState.speed = Number(playbackControls.speedSelect?.value) || 1;
      if (playbackState.playing) {
        schedulePlaybackTick();
      }
    }

    async function togglePlayback() {
      if (playbackState.pending) return;
      const timeline = playbackState.timeline || [];
      if (!timeline.length) return;

      if (playbackState.playing) {
        stopPlayback();
        return;
      }

      const startBound = Math.max(playbackState.minIndex ?? 0, playbackState.rangeStartIdx ?? 0);
      const span = playbackState.maxIndex - startBound;
      if (span <= 0) {
        updatePlaybackUI();
        return;
      }

      if (playbackState.pointer == null) {
        playbackState.pointer = startBound;
      }

      const atEnd = playbackState.pointer != null && playbackState.pointer >= playbackState.maxIndex;
      if (atEnd) {
        if (startBound < playbackState.maxIndex) {
          playbackState.pointer = startBound;
        } else {
          stopPlayback();
          const status = document.getElementById('status');
          if (status) {
            const hint = playbackState.actualStartISO ? `Playback range: ${playbackState.actualStartISO} → ${timeline[playbackState.maxIndex] || 'latest'}` : '';
            status.textContent = `Playback already at end of selected range. Clear the End date or pick an earlier pointer to play. ${hint}`.trim();
          }
          return;
        }
      }

      playbackState.playing = true;
      updatePlaybackUI();
      schedulePlaybackTick();
    }

    function schedulePlaybackTick() {
      if (playbackState.timer) {
        clearTimeout(playbackState.timer);
      }
      if (!playbackState.playing) return;
      const intervalMs = 900;
      playbackState.timer = setTimeout(async () => {
        const amount = playbackState.speed || 1;
        const ok = await stepPlayback(1, amount);
        if (!ok) {
          stopPlayback();
          return;
        }
        if (playbackState.playing) {
          schedulePlaybackTick();
        }
      }, intervalMs);
    }

    function stopPlayback() {
      playbackState.playing = false;
      if (playbackState.timer) {
        clearTimeout(playbackState.timer);
        playbackState.timer = null;
      }
      updatePlaybackUI();
    }

    async function stepPlayback(direction, amountOverride) {
      const timeline = playbackState.timeline || [];
      if (!timeline.length) return false;
      if (playbackState.pending) return false;
      const stepSize = amountOverride != null ? amountOverride : 1;
      if (!stepSize) return false;
      const current = playbackState.pointer != null ? playbackState.pointer : timeline.length - 1;
      let next = current + direction * stepSize;
  const minIdx = Math.max(playbackState.minIndex ?? 0, playbackState.rangeStartIdx ?? 0);
  if (next < minIdx) next = minIdx;
      if (next > timeline.length - 1) next = timeline.length - 1;
      if (next === current) return false;

      playbackState.pending = true;
      updatePlaybackUI();
      const targetDate = timeline[next];
      try {
        const baseBody = cloneBody(playbackState.requestBody || {});
        baseBody.end_date = targetDate;
        const js = await fetchBacktest(baseBody);
        handleBacktestSuccess(js, baseBody, { pointerDate: targetDate, preserveRequest: true });
        playbackState.pointer = next;
        return true;
      } catch (err) {
        console.error(err);
        const status = document.getElementById('status');
        if (status) status.textContent = `Playback error: ${err.message || err}`;
        const msg = String(err?.message || '').toLowerCase();
        if (msg.includes('not enough rows')) {
          const timeline = playbackState.timeline || [];
          const idx = timeline.indexOf(targetDate);
          const candidate = idx >= 0 ? idx + 1 : next + 1;
          const newMin = Math.min(playbackState.maxIndex, Math.max(playbackState.minIndex ?? 0, candidate));
          playbackState.minIndex = Number.isFinite(newMin) ? newMin : (playbackState.minIndex ?? 0);
          if ((playbackState.rangeStartIdx ?? 0) < playbackState.minIndex) {
            playbackState.rangeStartIdx = playbackState.minIndex;
          }
          playbackState.pointer = playbackState.minIndex;
          stopPlayback();
        }
        return false;
      } finally {
        playbackState.pending = false;
        updatePlaybackUI();
      }
    }

  setupPlaybackControls();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPlayback();
    }
  });

  document.getElementById('run').addEventListener('click', runBacktest);
    const debouncedRun = debounce(runBacktest, 400);
    document.getElementById('symbol').addEventListener('input', debouncedRun);
    document.getElementById('symbol').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); runBacktest(); }});
    document.getElementById('start').addEventListener('change', runBacktest);
    document.getElementById('end').addEventListener('change', runBacktest);
    // Re-render on overlay toggle changes (simple: re-run backtest to replot)
    ['show_ma','show_kama','show_rsi','show_stoch','skip_weekends','show_eq','ema_fast','ema_slow','kama_n'].forEach(id=>{
      const el = document.getElementById(id); if(el){ el.addEventListener('change', runBacktest); }
    });
    async function applyStrategyDefaultsFromServer(strat){
      try{
        const res = await fetch(`/api/strategy/defaults?id=${encodeURIComponent(strat)}`);
        if(!res.ok) return false;
        const js = await res.json();
        if(js.status !== 'ok') return false;
        const p = js.params || {};
        const setVal = (id,val)=>{ const el=document.getElementById(id); if(el!=null && val!=null){ if(el.type==='checkbox'){ el.checked = !!val; } else { el.value = val; } } };
        // Core params
        setVal('macd_fast', p.macd_fast);
        setVal('macd_slow', p.macd_slow);
        setVal('macd_signal', p.macd_signal);
        setVal('pre_bars', p.pre_bars);
        setVal('sell_bars', p.sell_bars);
        setVal('adx_min', p.adx_min);
        setVal('stop_pct', p.stop_loss_pct);
        setVal('trailing', p.trailing_stop);
        setVal('conv_win', p.conv_window);
        setVal('p_buy', p.p_buy);
        setVal('e_buy', p.e_buy);
        setVal('p_sell', p.p_sell);
        setVal('vol_v', p.vol_sma_period);
        setVal('vol_strict', p.vol_down_strict);
        setVal('zero_stop', p.macd_zero_stop);
        // Indicators
        setVal('rsi_period', p.rsi_period);
        setVal('stoch_k', p.stoch_k);
        setVal('stoch_d', p.stoch_d);
        setVal('ema_fast', p.ema_fast);
        setVal('ema_slow', p.ema_slow);
        setVal('kama_n', p.kama_n);
        return true;
      }catch{ return false; }
    }

    document.getElementById('strategy').addEventListener('change', async ()=>{
      const strat = document.getElementById('strategy').value;
      const ok = await applyStrategyDefaultsFromServer(strat);
      if(!ok){
        // Fallback to hardcoded defaults if server/YAML not available
        if (strat === 'macd_cross') {
          document.getElementById('macd_fast').value = 12;
          document.getElementById('macd_slow').value = 26;
          document.getElementById('macd_signal').value = 9;
          document.getElementById('pre_bars').value = 2;
          document.getElementById('sell_bars').value = 2;
          document.getElementById('adx_min').value = 0;
          document.getElementById('stop_pct').value = 0;
          document.getElementById('trailing').checked = false;
          document.getElementById('conv_win').value = 60;
          document.getElementById('p_buy').value = 35;
          document.getElementById('e_buy').value = 20;
          document.getElementById('p_sell').value = 40;
        } else if (strat === 'macd_pre_cross_below_zero') {
          document.getElementById('macd_fast').value = 5;
          document.getElementById('macd_slow').value = 35;
          document.getElementById('macd_signal').value = 5;
          document.getElementById('pre_bars').value = 3;
          document.getElementById('sell_bars').value = 2;
          document.getElementById('adx_min').value = 25;
          document.getElementById('stop_pct').value = 9;
          document.getElementById('trailing').checked = true;
          document.getElementById('conv_win').value = 60;
          document.getElementById('p_buy').value = 35;
          document.getElementById('e_buy').value = 20;
          document.getElementById('p_sell').value = 40;
          document.getElementById('vol_v').value = 20;
          document.getElementById('vol_strict').checked = false;
          document.getElementById('zero_stop').checked = false;
        } else if (strat === 'macd_convergence_stock') {
          document.getElementById('macd_fast').value = 12;
          document.getElementById('macd_slow').value = 26;
          document.getElementById('macd_signal').value = 9;
          document.getElementById('pre_bars').value = 3;
          document.getElementById('sell_bars').value = 2;
          document.getElementById('adx_min').value = 20;
          document.getElementById('stop_pct').value = 8;
          document.getElementById('trailing').checked = false;
          document.getElementById('conv_win').value = 60;
          document.getElementById('p_buy').value = 40;
          document.getElementById('e_buy').value = 25;
          document.getElementById('p_sell').value = 50;
          document.getElementById('vol_v').value = 20;
          document.getElementById('vol_strict').checked = false;
          document.getElementById('zero_stop').checked = true;
        }
      }
      debouncedRun();
    });
    initDefaultDates();
    runBacktest();
  </script>
</body>
